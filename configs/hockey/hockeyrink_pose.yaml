path: REPO_ROOT/datasets/hockeyrink
train: [images/train, ../hockeyrink_nhl/images/train]
val: [images/val, ../hockeyrink_nhl/images/val]
kpt_shape: [56, 3]
# Espejo izquierda<->derecha de los 56 puntos: volteando la imagen, la zona A pasa a ser la B
# (comprobado contra la geometria del template). Sin esto no se puede usar fliplr.
flip_idx: [54, 55, 48, 49, 50, 51, 52, 53, 46, 47, 42, 43, 44, 45, 40, 41, 36, 37, 38, 39, 34, 35, 32, 33, 24, 25, 26, 27, 31, 29, 30, 28, 22, 23, 20, 21, 16, 17, 18, 19, 14, 15, 10, 11, 12, 13, 8, 9, 2, 3, 4, 5, 6, 7, 0, 1]
names:
  0: rink

# kpt_oks_sigmas fija la tolerancia de la OKS loss, y con la caja del rink es la que
# decide el techo de precision del modelo. Ultralytics calcula
#
#     e = d^2 / ((2*sigma)^2 * area * 2)        loss = 1 - exp(-e)
#
# con area = area de la caja, que aqui es el 68% del frame (~718k px^2 a 1024). La
# distancia donde e=1, medida sobre las etiquetas reales:
#
#     sigma    d(e=1)      loss de un error de 89 px@1920
#     0.10      449 px          0.038      <- lo que habia: no penaliza nada
#     0.05      225 px          0.145
#     0.02       90 px          0.625      <- este
#     0.01       45 px          0.980
#
# Con 0.10 el modelo convergia con un error mediano de 89 px por keypoint (solo el
# 1% bajaba de 8 px) porque para la loss eso ya era perfecto: pose mAP50-95 de 0.50
# con homografias inservibles (0% de frames usables, ver training/rink_metric.py).
#
# 0.02 deja el error actual justo en e=1, que es donde el gradiente es mayor. NO
# bajar mas de golpe: por debajo de ~0.01 la loss se satura a 1.0 para el error de
# partida y el gradiente se vuelve a anular, que es el fallo que documentaba el
# comentario anterior. Y 0.02 solo vale para afinar desde un checkpoint que ya
# ronda los 90 px; entrenando desde cero (COCO) hay que arrancar en 0.10 e ir
# bajando, o la pose_loss se queda clavada en ~0.99 * pose_gain desde el epoch 1.
kpt_oks_sigmas: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02,
                 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02,
                 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02,
                 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02]
